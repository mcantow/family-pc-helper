name: debug ssh reject
on: workflow_dispatch
jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Run the helper exactly as grandma did
        shell: pwsh
        env:
          FH_TEST: '1'
        run: |
          Invoke-WebRequest 'https://github.com/mcantow/family-pc-helper/releases/latest/download/Michael-Helper.exe' -OutFile "$env:RUNNER_TEMP\h.exe"
          $p = Start-Process "$env:RUNNER_TEMP\h.exe" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(1500000)) { 'still running'; exit 1 }
          "helper exit: $($p.ExitCode)"
      - name: Prove key login as a normal local admin (mirrors grandma's rober)
        shell: pwsh
        run: |
          # The runner ships an AllowGroups line and a weird service account; grandma's
          # home PC does not. Remove that line and use a fresh local admin to mirror her.
          $cfg = 'C:\ProgramData\ssh\sshd_config'
          (Get-Content $cfg) | Where-Object { $_ -notmatch '^\s*AllowGroups\b' } | Set-Content $cfg -Encoding ascii
          "=== effective global auth after helper fix ==="
          & 'C:\Windows\System32\OpenSSH\sshd.exe' -T 2>&1 | Select-String '^passwordauthentication|^pubkeyauthentication'
          $pw = 'Gma!' + [guid]::NewGuid().ToString('N').Substring(0,10) + 'x9'
          $u  = 'gmatest'
          net user $u $pw /add | Out-Null
          net localgroup administrators $u /add | Out-Null
          # place my key the way the helper does, owner = Administrators
          $ak = 'C:\ProgramData\ssh\administrators_authorized_keys'
          ssh-keygen -t ed25519 -f "$env:RUNNER_TEMP\probe" -N '""' -C probe | Out-Null
          $pub = Get-Content "$env:RUNNER_TEMP\probe.pub"
          $lines=@(); if (Test-Path $ak){ $lines += (Get-Content $ak | Where-Object {$_ -match '^ssh-'}) }
          $lines += $pub
          [IO.File]::WriteAllText($ak, ($lines -join "`n") + "`n", (New-Object Text.ASCIIEncoding))
          icacls $ak /reset | Out-Null
          icacls $ak /inheritance:r /grant 'Administrators:F' 'SYSTEM:F' | Out-Null
          $acl=Get-Acl $ak; $acl.SetOwner([Security.Principal.NTAccount]'BUILTIN\Administrators'); Set-Acl $ak $acl
          Restart-Service sshd
          Start-Sleep 3
          icacls "$env:RUNNER_TEMP\probe" /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          "=== key login as $u ==="
          $out = ssh -i "$env:RUNNER_TEMP\probe" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 "$u@127.0.0.1" "echo KEY_LOGIN_OK; whoami" 2>&1
          "RESULT: $out"
          if ($out -match 'KEY_LOGIN_OK') { "PROOF: key login works" } else { "PROOF FAILED"; exit 1 }
